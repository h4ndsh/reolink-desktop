# Builds the Windows installer and portable zip (scripts/build-windows.sh) in
# MSYS2 UCRT64. Runs on version tags (and attaches the files to the GitHub
# release) or by hand from the Actions tab; `make windows-ci` starts it with gh.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            toolchain:p rust:p pkgconf:p ntldd:p
            gtk4:p libadwaita:p librsvg:p adwaita-icon-theme:p glib-networking:p
            gstreamer:p gst-plugins-base:p gst-plugins-good:p gst-plugins-bad:p gst-libav:p

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - uses: actions/cache@v4
        with:
          path: target
          key: windows-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-target-

      - name: Build
        run: scripts/build-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: reolink-desktop-windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*-portable.zip
